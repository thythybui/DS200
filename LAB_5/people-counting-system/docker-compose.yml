version: "3.8"

services:
  # ---- Hạ tầng Big Data: message broker cho luồng dữ liệu camera ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [people-counting-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [people-counting-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [people-counting-net]

  # ---- Server lưu trữ: NoSQL phù hợp dữ liệu bán cấu trúc, ghi nhanh ----
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: [people-counting-net]

  # ---- Server 1: nhận khung hình camera, đẩy lên Kafka ----
  camera-server:
    build: ./camera_server
    container_name: camera-server
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAMES_TOPIC: camera-frames
      VIDEO_SOURCE: /app/sample_video/sample.mp4
      CAMERA_ID: cam-01
      TARGET_FPS: 5
    volumes:
      - ./sample_video:/app/sample_video
    networks: [people-counting-net]
    restart: unless-stopped

  # ---- Server 2: nhận diện người, tính bounding box ----
  processing-server:
    build: ./processing_server
    container_name: processing-server
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INPUT_TOPIC: camera-frames
      OUTPUT_TOPIC: detection-results
      CONSUMER_GROUP: processing-server-group
      MODEL_NAME: yolov8n.pt
      CONF_THRESHOLD: 0.4
      USE_MOCK_DETECTION: "false"   # đặt "true" để test pipeline không cần tải model YOLO
    networks: [people-counting-net]
    restart: unless-stopped
    # Có thể scale ngang nhiều instance cùng consumer group để xử lý song song (đặc trưng Big Data streaming):
    # docker compose up --scale processing-server=3

  # ---- Server 3: lưu kết quả vào MongoDB ----
  storage-server:
    build: ./storage_server
    container_name: storage-server
    depends_on: [kafka, mongodb]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INPUT_TOPIC: detection-results
      CONSUMER_GROUP: storage-server-group
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: people_counting
      MONGO_COLLECTION: detections
    networks: [people-counting-net]
    restart: unless-stopped

  # ---- Dashboard xem số người theo thời gian thực ----
  dashboard:
    build: ./dashboard
    container_name: dashboard
    depends_on: [mongodb]
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: people_counting
      MONGO_COLLECTION: detections
    networks: [people-counting-net]
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  people-counting-net:
    driver: bridge
